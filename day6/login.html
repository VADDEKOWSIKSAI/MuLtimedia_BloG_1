<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Course Registration Form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Course Registration Form</h1>
    <form action="#">
      <div class="field">
        <fieldset>
          <legend>Personal Details</legend>
          <table>
            <tr>
              <td>
                <label for="firstName">First Name:</label>
              </td>
              <td>
                <input
                  placeholder="Eg: kowsik sai"
                  type="text"
                  name="firstName"
                  id="firstName"
                  required
                />
              </td>
            </tr>
            <tr>
              <td>
                <label for="surname">Surname:</label>
              </td>
              <td>
                <input
                  placeholder="Eg: vadde"
                  type="text"
                  name="surname"
                  id="surname"
                  required
                />
              </td>
            </tr>
            <tr>
              <td><label for="mobile">Mobile Number:</label></td>
              <td>
                <input
                  placeholder="6203135259"
                  type="tel"
                  name="mobile"
                  id="mobile"
                  required
                />
              </td>
            </tr>
            <tr>
              <td><label for="email">Email:</label></td>
              <td>
                <input
                  placeholder="name@gmail.com"
                  type="email"
                  name="email"
                  id="email"
                  required
                />
              </td>
            </tr>
            <tr>
              <td><label for="password">Password:</label></td>
              <td>
                <input type="password" name="password" id="password" required />
              </td>
            </tr>
            <tr>
              <td><label for="confirmPassword">Confirm password:</label></td>
              <td>
                <input
                  type="password"
                  name="confirmPassword"
                  id="confirmPassword"
                  required
                />
              </td>
            </tr>
            <tr>
              <td><label for="dob">DOB:</label></td>
              <td><input type="date" name="dob" id="dob" required /></td>
            </tr>
            <tr>
              <td><label>Gender:</label></td>
              <td>
                <input
                  type="radio"
                  name="gender"
                  id="male"
                  value="male"
                /><label for="male">Male</label>
                <input
                  type="radio"
                  name="gender"
                  id="female"
                  value="female"
                /><label for="female">Female</label>
                <input
                  type="radio"
                  name="gender"
                  id="other"
                  value="other"
                /><label for="other">Other</label>
              </td>
            </tr>
            <tr>
              <td><label for="country">Select Country:</label></td>
              <td>
                <select name="country" id="country">
                  <option value="india">INDIA</option>
                  <option value="usa">USA</option>
                  <option value="uk">UK</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label for="picture">Upload Picture:</label></td>
              <td><input type="file" name="picture" id="picture" /></td>
            </tr>
            <tr>
              <td>
                <button type="reset">Click to Reset</button>
              </td>
            </tr>
          </table>
        </fieldset>
      </div>

      <fieldset>
        <legend>Course Details</legend>
        <table>
          <tr>
            <td><label for="course">Select Course:</label></td>
            <td>
              <select name="course" id="course">
                <option value="python">Python Full Stack</option>
                <option value="java">Java Full Stack</option>
                <option value="datascience">Data Science</option>
                <option value="dataanalyst">Data Analyst</option>
              </select>
            </td>
          </tr>

          <tr>
            <td><label>Delivery mode:</label></td>
            <td>
              <input
                type="checkbox"
                name="mode"
                id="online"
                value="online"
              /><label for="online">Online</label>
              <input
                type="checkbox"
                name="mode"
                id="offline"
                value="offline"
              /><label for="offline">Offline</label>
            </td>
          </tr>
          <tr>
            <td><label for="feedback">Feedback:</label></td>
            <td>
              <textarea
                style="resize: none"
                rows="5"
                cols="30"
                name="feedback"
                id="feedback"
              ></textarea>
            </td>
          </tr>
          <tr>
            <td>
              <button type="submit">Click here to submit</button>
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
